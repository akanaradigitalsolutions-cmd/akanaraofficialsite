<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,500,400&f[]=satoshi@400,500&f[]=jetbrains-mono@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:"Satoshi",system-ui,sans-serif}
  .og{position:relative;width:1200px;height:630px;background:#FBF6EF;overflow:hidden;padding:74px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .blob{position:absolute;border-radius:50%;filter:blur(60px)}
  .b1{width:520px;height:520px;background:radial-gradient(circle,rgba(16,156,151,.42),transparent 70%);top:-160px;right:-120px}
  .b2{width:460px;height:460px;background:radial-gradient(circle,rgba(234,90,50,.34),transparent 70%);bottom:-180px;left:-120px}
  .b3{width:360px;height:360px;background:radial-gradient(circle,rgba(232,163,61,.30),transparent 70%);bottom:-140px;right:180px}
  .row{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:16px}
  .brand svg{width:52px;height:52px;display:block}
  .brand .name{font-family:"Clash Display",system-ui,sans-serif;font-weight:600;font-size:38px;letter-spacing:-.01em;color:#211A15}
  .eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:16px;letter-spacing:.18em;color:#0C7C78;text-transform:uppercase}
  h1{position:relative;z-index:2;font-family:"Clash Display",system-ui,sans-serif;font-weight:500;font-size:104px;line-height:.98;letter-spacing:-.03em;color:#211A15;max-width:15ch}
  h1 em{font-style:italic;font-weight:400;color:#EA5A32}
  .foot{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between}
  .tags{display:flex;gap:12px}
  .tags b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400;font-size:16px;letter-spacing:.04em;color:#4A4038;border:1px solid rgba(33,26,21,.18);border-radius:100px;padding:9px 16px;background:#fff}
  .url{font-family:"Clash Display",system-ui,sans-serif;font-weight:500;font-size:22px;color:#211A15}
</style>
</head>
<body>
<div class="og">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

  <div class="row">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z" fill="url(#g)"/><circle cx="20" cy="30" r="2.6" fill="#FBF6EF"/><defs><linearGradient id="g" x1="6" y1="3" x2="34" y2="34"><stop stop-color="#F2C46E"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs></svg>
      <span class="name">Akanara</span>
    </div>
    <span class="eyebrow">Digital Studio · Bali</span>
  </div>

  <h1>We build the <em>future-facing</em> web.</h1>

  <div class="foot">
    <div class="tags"><b>Web</b><b>Apps</b><b>Google Ads</b><b>SEO · GEO</b></div>
    <span class="url">akanara.com</span>
  </div>
</div>
</body>
</html>
