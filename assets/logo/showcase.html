<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,500&f[]=satoshi@400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;font-family:"Satoshi",system-ui,sans-serif;background:#fff;color:#211A15}
  .grad{}
  svg .wm{font-family:"Clash Display","Satoshi",system-ui,sans-serif}
  .sheet{width:1200px}
  .head{padding:44px 56px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(33,26,21,.1)}
  .head .k{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.2em;color:#0C7C78}
  .head .t{font-family:"Clash Display",sans-serif;font-weight:500;font-size:30px;letter-spacing:-.02em;margin-top:8px}
  .head .r{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.14em;color:#8A7E70}
  .panel{padding:56px}
  .panel.light{background:#FBF6EF}
  .panel.dark{background:#211A15}
  .lbl{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A7E70;margin-bottom:20px}
  .panel.dark .lbl{color:#B7AE9F}
  .primary{display:flex;align-items:center;gap:60px;padding-bottom:20px}
  .row{display:flex;align-items:center;gap:40px;margin-top:44px;flex-wrap:wrap}
  .cell{border:1px solid rgba(33,26,21,.10);border-radius:16px;padding:30px 34px;display:flex;align-items:center;justify-content:center;background:#fff}
  .panel.dark .cell{border-color:rgba(255,255,255,.14);background:#191410}
  .cap{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;color:#8A7E70;text-align:center;margin-top:12px}
  .panel.dark .cap{color:#B7AE9F}
  .cellwrap{display:flex;flex-direction:column;align-items:center}
  .swatches{display:flex;gap:0;border:1px solid rgba(33,26,21,.1);border-radius:14px;overflow:hidden;margin-top:10px}
  .sw{width:150px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-family:"JetBrains Mono",monospace;font-size:11px}
</style>
</head>
<body>
<div class="sheet">

  <div class="head">
    <div>
      <div class="k">✦ BRAND MARK</div>
      <div class="t">Akanara — Logo System</div>
    </div>
    <div class="r">Sunlit Tropical · Bali</div>
  </div>

  <!-- LIGHT -->
  <div class="panel light">
    <div class="lbl">Primary logo — light background</div>
    <div class="primary">
      <svg viewBox="0 0 268 84" width="402" height="126" role="img" aria-label="Akanara Digital Solutions">
        <defs><linearGradient id="g1" x1="6" y1="3" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#F2C46E"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs>
        <g transform="translate(0,19) scale(1.15)"><path fill-rule="evenodd" fill="url(#g1)" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></g>
        <text class="wm" x="63" y="46" font-weight="600" font-size="37" letter-spacing="-0.6" fill="#211A15">Akanara</text>
        <text x="65" y="66" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="3.5" fill="#8A7E70">DIGITAL SOLUTIONS</text>
      </svg>
    </div>

    <div class="row">
      <div class="cellwrap"><div class="cell">
        <svg viewBox="0 0 220 168" width="150" height="115" role="img" aria-label="Akanara stacked">
          <defs><linearGradient id="g2" x1="6" y1="3" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#F2C46E"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs>
          <g transform="translate(82,14) scale(1.4)"><path fill-rule="evenodd" fill="url(#g2)" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></g>
          <text class="wm" x="110" y="120" text-anchor="middle" font-weight="600" font-size="38" letter-spacing="-0.6" fill="#211A15">Akanara</text>
          <text x="110" y="142" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="4" fill="#8A7E70">DIGITAL SOLUTIONS</text>
        </svg>
      </div><div class="cap">STACKED</div></div>

      <div class="cellwrap"><div class="cell">
        <svg viewBox="0 0 40 40" width="76" height="76"><defs><linearGradient id="g3" x1="6" y1="3" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#F2C46E"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs><path fill-rule="evenodd" fill="url(#g3)" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></svg>
      </div><div class="cap">MARK · GRADIENT</div></div>

      <div class="cellwrap"><div class="cell">
        <svg viewBox="0 0 40 40" width="76" height="76"><path fill-rule="evenodd" fill="#211A15" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></svg>
      </div><div class="cap">MARK · ONE COLOUR</div></div>

      <div class="cellwrap"><div class="cell" style="padding:0;border:none">
        <svg viewBox="0 0 40 40" width="84" height="84"><defs><linearGradient id="g4" x1="6" y1="3" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#F2C46E"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs><rect width="40" height="40" rx="9" fill="#0A0A0F"/><path fill-rule="evenodd" fill="url(#g4)" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></svg>
      </div><div class="cap">APP ICON</div></div>
    </div>
  </div>

  <!-- DARK -->
  <div class="panel dark">
    <div class="lbl">Reversed — dark background</div>
    <div class="primary">
      <svg viewBox="0 0 268 84" width="402" height="126" role="img" aria-label="Akanara Digital Solutions">
        <defs><linearGradient id="g5" x1="6" y1="3" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#F2C46E"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs>
        <g transform="translate(0,19) scale(1.15)"><path fill-rule="evenodd" fill="url(#g5)" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></g>
        <text class="wm" x="63" y="46" font-weight="600" font-size="37" letter-spacing="-0.6" fill="#FBF6EF">Akanara</text>
        <text x="65" y="66" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="3.5" fill="#B7AE9F">DIGITAL SOLUTIONS</text>
      </svg>
    </div>
    <div class="row">
      <div class="cellwrap"><div class="cell">
        <svg viewBox="0 0 40 40" width="76" height="76"><defs><linearGradient id="g6" x1="6" y1="3" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#F2C46E"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs><path fill-rule="evenodd" fill="url(#g6)" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></svg>
      </div><div class="cap">MARK · GRADIENT</div></div>
      <div class="cellwrap"><div class="cell">
        <svg viewBox="0 0 40 40" width="76" height="76"><path fill-rule="evenodd" fill="#FBF6EF" d="M20 3 L34 34 H27 L20 17 L13 34 H6 Z M17.4 30 a2.6 2.6 0 1 1 5.2 0 a2.6 2.6 0 1 1 -5.2 0 Z"/></svg>
      </div><div class="cap">MARK · REVERSED</div></div>
    </div>
  </div>

  <!-- COLOURS -->
  <div class="panel light" style="border-top:1px solid rgba(33,26,21,.1)">
    <div class="lbl">Palette</div>
    <div class="swatches">
      <div class="sw" style="background:#E8A33D;color:#231703">GOLD<br>#E8A33D</div>
      <div class="sw" style="background:#EA5A32;color:#fff">CORAL<br>#EA5A32</div>
      <div class="sw" style="background:#109C97;color:#fff">TEAL<br>#109C97</div>
      <div class="sw" style="background:#211A15;color:#FBF6EF">INK<br>#211A15</div>
      <div class="sw" style="background:#FBF6EF;color:#211A15;border-left:1px solid rgba(33,26,21,.1)">PAPER<br>#FBF6EF</div>
    </div>
  </div>

</div>
</body>
</html>
