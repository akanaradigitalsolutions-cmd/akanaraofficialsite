name: Deploy to Hostinger

# Every push to this branch publishes the site to Hostinger over FTP.
# You can also run it by hand from the Actions tab (Run workflow).
on:
  push:
    branches: ["claude/optimistic-hypatia-7sdlup"]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an in-flight one.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # These three come from GitHub repo Settings -> Secrets -> Actions.
          # Never hard-code credentials in this file.
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # secure FTP; switch to "ftp" only if your host rejects ftps
          port: 21
          server-dir: public_html/   # where the live site lives on Hostinger
          # Repo-only files that must NOT be published to the live site:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            IMAGES.md
            DEPLOY.md
            .gitignore
            assets/og-image.html
            assets/logo/showcase.html
            assets/logo/README.md
